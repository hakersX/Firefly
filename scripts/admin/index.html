<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>猫窝后台</title>
<style>
:root{--bg:#fbf7f3;--panel:#fff;--line:#eadfd5;--text:#2d2620;--mute:#8a7d70;--accent:#e8833a;--accent2:#fbe6d4;--danger:#d64545}
@media (prefers-color-scheme:dark){:root{--bg:#1b1713;--panel:#25201a;--line:#3a322a;--text:#eee6dc;--mute:#9b8f82;--accent:#f09a58;--accent2:#3b2a1d;--danger:#f06a6a}}
*{box-sizing:border-box}
body{margin:0;height:100vh;display:flex;flex-direction:column;background:var(--bg);color:var(--text);font:14px/1.5 system-ui,"Microsoft YaHei",sans-serif}
header{display:flex;align-items:center;gap:12px;padding:8px 16px;border-bottom:1px solid var(--line);background:var(--panel)}
header h1{font-size:16px;margin:0}
header .sp{flex:1}
main{flex:1;display:grid;grid-template-columns:260px minmax(360px,1fr) minmax(360px,1fr);min-height:0}
section{min-width:0;min-height:0;display:flex;flex-direction:column;border-right:1px solid var(--line)}
button,input,select,textarea{font:inherit;color:inherit}
button{border:1px solid var(--line);background:var(--panel);padding:5px 12px;border-radius:8px;cursor:pointer}
button:hover{border-color:var(--accent)}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
button.danger{color:var(--danger)}
input,textarea,select{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:5px 8px;width:100%}
input:focus,textarea:focus{outline:2px solid var(--accent2);border-color:var(--accent)}
.list-head{padding:10px;display:flex;gap:6px;border-bottom:1px solid var(--line)}
.list-head button{white-space:nowrap;flex-shrink:0}
#list{overflow:auto;flex:1}
.item{padding:8px 12px;border-bottom:1px solid var(--line);cursor:pointer}
.item:hover,.item.active{background:var(--accent2)}
.item.active{border-left:3px solid var(--accent)}
.item .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .m{font-size:12px;color:var(--mute);display:flex;gap:6px;flex-wrap:wrap}
.tag{background:var(--accent2);color:var(--accent);border-radius:4px;padding:0 5px;font-size:11px}
#editor{overflow:auto}
.meta{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:12px;border-bottom:1px solid var(--line)}
.meta label{display:flex;flex-direction:column;gap:2px;font-size:12px;color:var(--mute)}
.meta .full{grid-column:1/-1}
.meta .chk{flex-direction:row;align-items:center;gap:6px;font-size:13px;color:var(--text)}
.meta .chk input{width:auto}
#body{flex:1;min-height:320px;margin:12px;width:calc(100% - 24px);resize:none;font-family:ui-monospace,Consolas,monospace;line-height:1.6}
.bar{display:flex;gap:8px;align-items:center;padding:8px 12px;border-bottom:1px solid var(--line);background:var(--panel)}
.bar .sp{flex:1}
.modes{display:flex;gap:4px}.modes button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.tools{display:flex;gap:4px}.tools button{padding:3px 8px;font-size:12px}
#status{font-size:12px;color:var(--mute)}
#preview{border-right:0}
.tabs{display:flex;gap:4px;padding:8px 12px;border-bottom:1px solid var(--line);background:var(--panel);align-items:center}
.tabs button.on{background:var(--accent2);border-color:var(--accent)}
#frame{flex:1;border:0;width:100%;background:#fff}
#md{flex:1;overflow:auto;padding:16px 24px;display:none}
#md img{max-width:100%}
#md pre{background:var(--accent2);padding:10px;border-radius:8px;overflow:auto}
#empty{margin:auto;color:var(--mute)}
.series-head{padding:8px 12px;border-bottom:1px solid var(--line);cursor:pointer;background:var(--bg);display:flex;align-items:center;gap:6px}
.series-head .t{font-weight:700;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.series-head:hover,.series-head.active{background:var(--accent2)}
.series-head.active{border-left:3px solid var(--accent)}
.item.chapter{padding-left:24px}
.list-empty{padding:16px 12px;color:var(--mute);font-size:13px}
.seriesOnly{display:none!important}
body.mode-series .seriesOnly{display:flex!important}
@media(max-width:1000px){main{grid-template-columns:200px 1fr}#preview{display:none}}
</style>
</head>
<body>
<header>
  <h1>🐱 猫窝后台</h1>
  <span class="modes"><button class="on" data-kind="posts">文章</button><button data-kind="series">连载</button><button data-kind="dynamic">日记</button></span>
  <span id="status"></span><span class="sp"></span>
  <a id="siteLink" href="http://localhost:4321/" target="_blank" style="color:var(--accent)">打开站点 ↗</a>
</header>
<main>
  <section id="side">
    <div class="list-head">
      <input id="q" placeholder="搜索标题/分类…"><button class="primary" id="btnNew">＋ 新建</button>
    </div>
    <div class="list-head" id="seriesHead" style="display:none">
      <button id="btnNewSeries" style="flex:1">＋ 新建连载作品</button>
    </div>
    <div id="list"></div>
  </section>
  <section id="editor">
    <div id="empty">← 选择一篇文章，或点「新建」</div>
    <div id="seriesForm" style="display:none;flex-direction:column">
      <div class="bar">
        <button class="primary" id="btnSaveSeries">保存作品信息</button>
        <button id="btnAddChapter">＋ 写新章节</button>
        <span class="sp"></span>
        <button class="danger" id="btnDelSeries">删除作品</button>
      </div>
      <div class="meta">
        <label class="full">作品名称<input id="s_name" placeholder="例如：拾薪记"></label>
        <label>连载状态
          <select id="s_status"><option value="ongoing">连载中</option><option value="completed">已完结</option></select>
        </label>
        <label>封面图（留空则用第一章的封面）<input id="s_cover" placeholder="/assets/images/xxx.jpg 或图片网址"></label>
        <label class="full">简介<textarea id="s_description" rows="6"></textarea></label>
        <div class="full" id="seriesInfo" style="font-size:12px;color:var(--mute)"></div>
      </div>
    </div>
    <div id="form" style="display:none;flex-direction:column;min-height:100%">
      <div class="bar">
        <button class="primary" id="btnSave">保存 (Ctrl+S)</button>
        <button id="btnImg">插入图片</button>
        <button id="btnAudio" title="上传 mp3 等音频，页面里可直接播放">插入音频</button>
        <input type="file" id="file" accept="image/*" hidden>
        <input type="file" id="fileAudio" accept="audio/*,.mp3,.m4a,.wav,.ogg,.flac,.aac" hidden>
        <span class="tools">
          <button data-wrap="center" title="选中文字居中">居中</button>
          <button data-wrap="right" title="选中文字靠右">靠右</button>
          <button data-wrap="none" title="取消首行缩进">不缩进</button>
          <button data-mark title="高亮选中文字">高亮</button>
          <button data-hr title="插入分隔线">分隔线</button>
        </span>
        <span class="sp"></span>
        <button class="danger" id="btnDel">删除</button>
      </div>
      <div class="meta" id="metaDiary" style="display:none">
        <label>时间<input id="d_published" type="datetime-local" step="1"></label>
        <label>地点<input id="d_location" placeholder="例如：无锡"></label>
        <label class="chk"><input type="checkbox" id="d_pinned">置顶</label>
        <div class="full" id="pathInfoD" style="font-size:12px;color:var(--mute)"></div>
      </div>
      <div class="meta" id="metaPost">
        <label class="seriesOnly">所属连载<select id="f_series"></select></label>
        <label class="seriesOnly">第几章<input id="f_chapter" type="number" min="1" step="1"></label>
        <label class="full">标题<input id="f_title"></label>
        <label>发布日期<input id="f_published" type="date"></label>
        <label>更新日期<input id="f_updated" type="date"></label>
        <label>分类<input id="f_category"></label>
        <label>标签（逗号分隔）<input id="f_tags"></label>
        <label>封面图<input id="f_image"></label>
        <label class="full">简介<input id="f_description"></label>
        <label class="full">排版风格（不用再手写 style）
          <select id="f_typography">
            <option value="">默认</option>
            <option value="novel">小说 · 首行缩进</option>
            <option value="novel-kai">小说 · 楷体 + 首行缩进</option>
            <option value="novel-song">小说 · 宋体 + 首行缩进</option>
            <option value="poem">诗歌 · 居中</option>
          </select>
        </label>
        <label class="chk"><input type="checkbox" id="f_draft">草稿（draft）</label>
        <label class="chk"><input type="checkbox" id="f_pinned">置顶</label>
        <div class="full" id="pathInfo" style="font-size:12px;color:var(--mute)"></div>
      </div>
      <textarea id="body" placeholder="在这里写 Markdown…（可直接粘贴/拖入图片）"></textarea>
    </div>
  </section>
  <section id="preview">
    <div class="tabs">
      <button id="tabReal" class="on">真实站点预览</button>
      <button id="tabMd">快速预览</button>
      <span style="flex:1"></span>
      <button id="btnReload" title="重新加载预览">⟳</button>
    </div>
    <iframe id="frame"></iframe>
    <div id="md"></div>
  </section>
</main>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script>
const $ = (id) => document.getElementById(id);
const FIELDS = ["title", "published", "updated", "category", "tags", "image", "description", "typography"];
let posts = [], cur = null, dirty = false, devPort = 4321, kind = "posts";
// 连载：series 是作品列表（各自带 chapters），curSeries 是正在编辑的作品，selSeries 是「新章节」默认归属的作品
let series = [], curSeries = null, selSeries = null;
const isD = () => kind === "dynamic";
const isS = () => kind === "series";
const STATUS_TEXT = { ongoing: "连载中", completed: "已完结" };
const kq = () => "kind=" + kind;
const pad2 = (n) => String(n).padStart(2, "0");
// 本地时间 → "YYYY-MM-DD HH:mm:ss"（日记 frontmatter 格式）
const nowStamp = () => { const d = new Date(); return d.getFullYear() + "-" + pad2(d.getMonth() + 1) + "-" + pad2(d.getDate()) + " " + pad2(d.getHours()) + ":" + pad2(d.getMinutes()) + ":" + pad2(d.getSeconds()); };

async function api(path, opts = {}) {
  const r = await fetch(path, opts);
  const j = await r.json();
  if (!r.ok) throw new Error(j.error || r.statusText);
  return j;
}
const setStatus = (t) => ($("status").textContent = t);
const mdPath = (p) => (/\.(md|mdx)$/i.test(p) ? p : p + ".md");

async function loadList() {
  if (isS()) {
    series = await api("/api/series");
    posts = series.flatMap((s) => s.chapters);
  } else {
    posts = await api("/api/posts?" + kq());
    // 连载章节统一放在「连载」里管理，文章列表只留单篇
    if (kind === "posts") posts = posts.filter((p) => !p.series);
  }
  renderList();
}
const tagEl = (text) => { const s = document.createElement("span"); s.className = "tag"; s.textContent = text; return s; };
function postItem(p, label) {
  const d = document.createElement("div");
  d.className = "item" + (isS() ? " chapter" : "") + (cur && cur.path === p.path ? " active" : "");
  const t = document.createElement("div");
  t.className = "t"; t.textContent = label || p.title;
  const m = document.createElement("div");
  m.className = "m";
  const date = document.createElement("span");
  date.textContent = p.published || "无日期";
  m.appendChild(date);
  for (const [on, text] of [[p.draft, "草稿"], [p.pinned, "置顶"], [!isS() && p.category, p.category]]) {
    if (on) m.appendChild(tagEl(text));
  }
  d.append(t, m);
  d.onclick = () => open(p.path);
  return d;
}
function renderList() {
  const kw = $("q").value.trim().toLowerCase();
  $("list").innerHTML = "";
  if (isS()) return renderSeriesList(kw);
  for (const p of posts) {
    if (kw && !(p.title + p.category + p.path).toLowerCase().includes(kw)) continue;
    $("list").appendChild(postItem(p));
  }
}
function renderSeriesList(kw) {
  if (!series.length) {
    $("list").innerHTML = '<div class="list-empty">还没有连载作品，点上面「新建连载作品」开始写第一部。</div>';
    return;
  }
  for (const s of series) {
    const chs = s.chapters.filter((c) => !kw || (c.title + s.name).toLowerCase().includes(kw));
    if (kw && !chs.length) continue;
    const h = document.createElement("div");
    h.className = "series-head" + (curSeries && !cur && curSeries.id === s.id ? " active" : "");
    const t = document.createElement("span");
    t.className = "t"; t.textContent = "📖 " + s.name;
    h.append(t, tagEl(s.unregistered ? "未登记" : STATUS_TEXT[s.status] || "连载中"), tagEl(s.chapters.length + " 章"));
    h.onclick = () => openSeries(s.id);
    $("list").appendChild(h);
    for (const c of chs) $("list").appendChild(postItem(c, `第 ${c.chapter || "?"} 章 · ${c.title}`));
  }
}
$("q").oninput = renderList;

const confirmLeave = () => !dirty || confirm("当前修改尚未保存，确定放弃？");

function fill(data, content) {
  if (isD()) {
    $("d_published").value = String(data.published || "").replace(" ", "T");
    $("d_location").value = data.location || "";
    $("d_pinned").checked = !!data.pinned;
    $("body").value = content;
    cur.extra = Object.fromEntries(Object.entries(data).filter(([k]) => !["published", "pinned", "location"].includes(k)));
    return;
  }
  for (const f of FIELDS) $("f_" + f).value = f === "tags" ? (data.tags || []).join(", ") : (data[f] ?? "");
  $("f_draft").checked = !!data.draft;
  $("f_pinned").checked = !!data.pinned;
  const sel = $("f_series");
  sel.innerHTML = "";
  const opts = [["", "（不属于连载）"], ...series.map((s) => [s.id, s.name])];
  if (data.series && !series.some((s) => s.id === data.series)) opts.push([data.series, data.series]);
  for (const [v, t] of opts) sel.add(new Option(t, v));
  sel.value = data.series || "";
  $("f_chapter").value = data.chapter || "";
  $("body").value = content;
  cur.slug = data.slug || "";
  cur.extra = Object.fromEntries(Object.entries(data).filter(([k]) => ![...FIELDS, "draft", "pinned", "slug", "series", "chapter"].includes(k)));
}
function collect() {
  if (isD()) {
    const t = $("d_published").value.replace("T", " ");
    const data = { ...cur.extra, published: t.length === 16 ? t + ":00" : t, location: $("d_location").value.trim(), pinned: $("d_pinned").checked };
    return { data, content: $("body").value };
  }
  const data = { ...cur.extra };
  data.title = $("f_title").value.trim();
  data.published = $("f_published").value;
  if ($("f_updated").value) data.updated = $("f_updated").value;
  data.description = $("f_description").value;
  data.image = $("f_image").value;
  if ($("f_typography").value) data.typography = $("f_typography").value;
  data.tags = $("f_tags").value.split(/[,，]/).map((s) => s.trim()).filter(Boolean);
  data.category = $("f_category").value;
  data.draft = $("f_draft").checked;
  data.pinned = $("f_pinned").checked;
  const sid = $("f_series").value;
  if (sid) {
    data.series = sid;
    data.chapter = Math.max(1, Math.round(Number($("f_chapter").value)) || 1);
  }
  if (cur.slug) data.slug = cur.slug;
  return { data, content: $("body").value };
}
// pane: "empty" | "form"（文章/章节/日记编辑）| "series"（连载作品信息）
function showPane(pane) {
  $("empty").style.display = pane === "empty" ? "" : "none";
  $("form").style.display = pane === "form" ? "flex" : "none";
  $("seriesForm").style.display = pane === "series" ? "flex" : "none";
}
const show = (on) => showPane(on ? "form" : "empty");

async function open(p) {
  if (!confirmLeave()) return;
  try {
    const { data, content } = await api("/api/post?" + kq() + "&path=" + encodeURIComponent(p));
    cur = { path: p, isNew: false };
    curSeries = null;
    if (data.series) selSeries = data.series;
    fill(data, content);
    $("pathInfo").textContent = $("pathInfoD").textContent = "文件：" + p;
    $("btnDel").style.display = "";
    dirty = false; show(true); renderList(); reloadFrame(); renderMd(); setStatus("");
  } catch (e) { alert("打开失败：" + e.message); }
}

$("btnNew").onclick = () => {
  if (isS()) return newChapter();
  if (!confirmLeave()) return;
  cur = { path: "", isNew: true };
  if (isD()) fill({ published: nowStamp(), location: "" }, "");
  else fill({ published: new Date().toISOString().slice(0, 10), draft: true, tags: [] }, "");
  $("pathInfo").textContent = $("pathInfoD").textContent = isD() ? "文件名会按时间自动生成" : "文件名与链接将根据标题自动生成";
  $("btnDel").style.display = "none";
  show(true); dirty = false; renderList(); renderMd();
  (isD() ? $("body") : $("f_title")).focus();
};


async function save() {
  if (!cur) return;
  try {
    if (cur.isNew && isD()) {
      const t = ($("d_published").value || "").replace("T", "-").replace(/:/g, "").replace(/-(\d{2})(\d{2})(\d{2})?$/, (m, a, b, c) => "-" + a + b + (c || "00"));
      if (!t) return alert("请先选择时间");
      let n = t, i = 2;
      const taken = new Set(posts.map((x) => x.path));
      while (taken.has(n + ".md")) n = t + "-" + i++;
      cur.path = n + ".md";
    } else if (cur.isNew) {
      const title = $("f_title").value.trim();
      if (!title) return alert("请先填写标题");
      let base = (await api("/api/slugify?name=" + encodeURIComponent(title))).slug || "post-" + Date.now();
      // 列表里可能只是单篇或只是章节，查重要对照全部文章
      const all = await api("/api/posts?kind=posts");
      const taken = new Set(all.flatMap((x) => [x.path, x.slug]));
      let n = base, i = 2;
      while (taken.has(n + ".md") || taken.has(n)) n = base + "-" + i++;
      cur.path = n + ".md"; cur.slug = n;
    }
    const p = cur.path;
    await api("/api/post?" + kq() + "&path=" + encodeURIComponent(p) + (cur.isNew ? "&create=1" : ""), {
      method: "PUT", body: JSON.stringify(collect()),
    });
    cur.isNew = false;
    $("pathInfo").textContent = $("pathInfoD").textContent = "文件：" + p; $("btnDel").style.display = "";
    dirty = false;
    setStatus("已保存 " + new Date().toLocaleTimeString());
    if (!isD() && $("f_series").value) selSeries = $("f_series").value;
    await loadList();
    setTimeout(reloadFrame, 900); // 等 dev server 热更新
  } catch (e) { alert("保存失败：" + e.message); }
}
$("btnSave").onclick = save;
addEventListener("keydown", (e) => {
  if ((e.ctrlKey || e.metaKey) && e.key === "s") {
    e.preventDefault();
    if ($("seriesForm").style.display !== "none") saveSeries(); else save();
  }
});

// ---------- 连载作品 ----------
const seriesUrl = (id) => `http://localhost:${devPort}/series/${encodeURIComponent(id)}/`;

function openSeries(id) {
  if (!confirmLeave()) return;
  const s = series.find((x) => x.id === id);
  if (!s) return;
  cur = null; curSeries = { id, isNew: false }; selSeries = id;
  $("s_name").value = s.unregistered ? "" : s.name;
  $("s_status").value = s.status === "completed" ? "completed" : "ongoing";
  $("s_cover").value = s.cover || "";
  $("s_description").value = s.description || "";
  $("seriesInfo").textContent = s.unregistered
    ? `有 ${s.chapters.length} 章文章标记了这部作品，但它还没登记：填好名称保存即可。`
    : s.chapters.length ? `共 ${s.chapters.length} 章（草稿章节只在本地显示）` : "还没有章节，点「写新章节」开始。没有章节的作品不会出现在网站上。";
  $("btnDelSeries").style.display = s.unregistered ? "none" : "";
  $("btnAddChapter").style.display = "";
  dirty = false; setStatus(""); showPane("series"); renderList();
  $("frame").src = s.chapters.length ? seriesUrl(id) : "about:blank";
}

$("btnNewSeries").onclick = () => {
  if (!confirmLeave()) return;
  cur = null; curSeries = { isNew: true };
  for (const k of ["s_name", "s_cover", "s_description"]) $(k).value = "";
  $("s_status").value = "ongoing";
  $("seriesInfo").textContent = "保存后就可以开始写第一章了";
  $("btnDelSeries").style.display = $("btnAddChapter").style.display = "none";
  dirty = false; showPane("series"); renderList(); $("frame").src = "about:blank";
  $("s_name").focus();
};

async function saveSeries() {
  if (!curSeries) return;
  const body = { name: $("s_name").value, status: $("s_status").value, cover: $("s_cover").value, description: $("s_description").value };
  if (!body.name.trim()) return alert("请先填写作品名称");
  try {
    const r = await api("/api/series" + (curSeries.isNew ? "" : "?id=" + encodeURIComponent(curSeries.id)), { method: "PUT", body: JSON.stringify(body) });
    dirty = false;
    await loadList();
    openSeries(r.id);
    setStatus("已保存 " + new Date().toLocaleTimeString());
  } catch (e) { alert("保存失败：" + e.message); }
}
$("btnSaveSeries").onclick = saveSeries;

$("btnDelSeries").onclick = async () => {
  if (!curSeries || curSeries.isNew) return;
  const s = series.find((x) => x.id === curSeries.id);
  if (s && s.chapters.length) return alert(`「${s.name}」下还有 ${s.chapters.length} 章，先把章节删掉（或改到别的作品）再删作品。`);
  if (!confirm(`删除连载作品「${s ? s.name : ""}」？`)) return;
  try {
    await api("/api/series?id=" + encodeURIComponent(curSeries.id), { method: "DELETE" });
    curSeries = null; dirty = false; showPane("empty"); $("frame").src = "about:blank";
    setStatus("作品已删除");
    await loadList();
  } catch (e) { alert("删除失败：" + e.message); }
};

function newChapter(sid) {
  if (!series.length) return alert("先点「新建连载作品」建一部作品，再写章节");
  if (!confirmLeave()) return;
  sid = sid || selSeries || series[0].id;
  const s = series.find((x) => x.id === sid) || series[0];
  const next = Math.max(0, ...s.chapters.map((c) => c.chapter || 0)) + 1;
  cur = { path: "", isNew: true }; curSeries = null; selSeries = s.id;
  fill({ published: new Date().toISOString().slice(0, 10), draft: true, tags: [], series: s.id, chapter: next }, "");
  $("pathInfo").textContent = `「${s.name}」第 ${next} 章 · 文件名与链接将根据标题自动生成`;
  $("btnDel").style.display = "none";
  showPane("form"); dirty = false; renderList(); renderMd();
  $("f_title").focus();
}
$("btnAddChapter").onclick = () => newChapter(curSeries && curSeries.id);

$("btnDel").onclick = async () => {
  if (!cur || cur.isNew) return;
  if (!confirm(`删除「${isD() ? $("body").value.trim().slice(0, 20) : $("f_title").value}」？\n文件会被移到项目根目录的 .trash/ 文件夹，可手动找回。`)) return;
  try {
    const r = await api("/api/post?" + kq() + "&path=" + encodeURIComponent(cur.path), { method: "DELETE" });
    setStatus("已删除 → " + r.trashed);
    cur = null; dirty = false; show(false); $("frame").src = "about:blank"; await loadList();
  } catch (e) { alert("删除失败：" + e.message); }
};

// 排版工具栏：插入的都是 typography.css 里的现成类，不用手写 style
const WRAP = { center: "align-center", right: "align-right", none: "no-indent" };
function insertAround(before, after, placeholder) {
  const ta = $("body"), sel = ta.value.slice(ta.selectionStart, ta.selectionEnd) || placeholder;
  ta.setRangeText(before + sel + after, ta.selectionStart, ta.selectionEnd, "select");
  ta.focus(); ta.dispatchEvent(new Event("input"));
}
document.querySelectorAll(".tools button").forEach((b) => (b.onclick = () => {
  const NL = String.fromCharCode(10);
  if (b.dataset.wrap) insertAround('<div class="' + WRAP[b.dataset.wrap] + '">' + NL + NL, NL + NL + "</div>", "文字");
  else if ("mark" in b.dataset) insertAround("<mark>", "</mark>", "重点");
  else insertAround(NL + NL + "---" + NL + NL, "", "");
}));

// 图片：按钮选择 / 粘贴 / 拖拽
async function upload(file) {
  setStatus("上传中…");
  const name = file.name && file.name !== "image.png" ? file.name : `img-${Date.now()}.png`;
  const post = cur.isNew ? "x.md" : cur.path;
  const r = await api(`/api/upload?${kq()}&name=${encodeURIComponent(name)}&post=${encodeURIComponent(post)}`, { method: "POST", body: file });
  const ta = $("body");
  const NL = String.fromCharCode(10);
  const md = r.audio ? NL + NL + `<audio controls preload="none" src="${r.url}"></audio>` + NL + NL : `![](${r.url})`;
  ta.setRangeText(md, ta.selectionStart, ta.selectionEnd, "end");
  ta.dispatchEvent(new Event("input"));
}
const tryUpload = (f) => upload(f).then(() => setStatus("上传完成，别忘了保存")).catch((x) => { setStatus(""); alert("上传失败：" + x.message); });
$("btnImg").onclick = () => $("file").click();
$("btnAudio").onclick = () => $("fileAudio").click();
$("fileAudio").onchange = (e) => { if (e.target.files[0]) tryUpload(e.target.files[0]); e.target.value = ""; };
$("file").onchange = (e) => { if (e.target.files[0]) tryUpload(e.target.files[0]); e.target.value = ""; };
$("body").addEventListener("paste", (e) => {
  const f = [...e.clipboardData.files].find((f) => f.type.startsWith("image/"));
  if (f) { e.preventDefault(); tryUpload(f); }
});
$("body").addEventListener("drop", (e) => {
  const f = [...e.dataTransfer.files].find((f) => f.type.startsWith("image/") || f.type.startsWith("audio/") || /\.(mp3|m4a|wav|ogg|flac|aac)$/i.test(f.name));
  if (f) { e.preventDefault(); tryUpload(f); }
});

document.querySelectorAll("#form input, #form textarea, #form select, #seriesForm input, #seriesForm textarea, #seriesForm select").forEach((el) =>
  el.addEventListener(el.tagName === "SELECT" ? "change" : "input", () => {
    dirty = true; setStatus("未保存…");
    if (el.id === "body") renderMdSoon();
  }));
addEventListener("beforeunload", (e) => { if (dirty) e.preventDefault(); });

// 预览
function postUrl() {
  if (isD()) return cur ? `http://localhost:${devPort}/dynamic/` : null;
  if (!cur || cur.isNew) return null;
  const slug = cur.slug || cur.path.replace(/\.(md|mdx)$/i, "");
  return `http://localhost:${devPort}/posts/${slug}/`;
}
function reloadFrame() { const u = postUrl(); if (u) $("frame").src = u; }
let timer;
function renderMdSoon() { clearTimeout(timer); timer = setTimeout(renderMd, 200); }
function renderMd() {
  if (window.marked) $("md").innerHTML = marked.parse($("body").value);
  else $("md").textContent = $("body").value;
}
function showTab(real) {
  $("frame").style.display = real ? "" : "none";
  $("md").style.display = real ? "none" : "block";
  $("tabReal").classList.toggle("on", real);
  $("tabMd").classList.toggle("on", !real);
}
$("btnReload").onclick = () => { reloadFrame(); renderMd(); };
$("tabReal").onclick = () => showTab(true);
$("tabMd").onclick = () => { showTab(false); renderMd(); };

// 切换 文章 / 日记
function setMode(k) {
  if (k === kind) return;
  if (!confirmLeave()) return;
  kind = k; cur = null; curSeries = null; dirty = false; show(false); $("frame").src = "about:blank";
  document.querySelectorAll(".modes button").forEach((b) => b.classList.toggle("on", b.dataset.kind === k));
  document.body.classList.toggle("mode-series", isS());
  $("seriesHead").style.display = isS() ? "" : "none";
  $("btnNew").textContent = isS() ? "＋ 新章节" : "＋ 新建";
  $("metaPost").style.display = isD() ? "none" : "";
  $("metaDiary").style.display = isD() ? "" : "none";
  document.querySelector(".tools").style.display = isD() ? "none" : "";
  $("q").placeholder = isD() ? "搜索日记内容/地点…" : isS() ? "搜索作品/章节标题…" : "搜索标题/分类…";
  $("empty").textContent = isD() ? "← 选择一篇日记，或点「新建」写今天的" : isS() ? "← 选择一部连载或某一章，或新建连载作品" : "← 选择一篇文章，或点「新建」";
  $("body").placeholder = isD() ? "今天发生了什么…（可直接粘贴/拖入图片）" : "在这里写 Markdown…（可直接粘贴/拖入图片）";
  loadList();
}
document.querySelectorAll(".modes button").forEach((b) => (b.onclick = () => setMode(b.dataset.kind)));

(async () => {
  devPort = (await api("/api/config")).devPort;
  $("siteLink").href = `http://localhost:${devPort}/`;
  await loadList();
})();
</script>
</body>
</html>
